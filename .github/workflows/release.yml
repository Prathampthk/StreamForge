name: Publish reviewed images
on:
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: 'After separate spend approval, type: Publish reviewed images'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
  deployments: read
concurrency:
  group: aws-dev-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: aws-dev-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require explicit publication confirmation
        env:
          CONFIRMATION: ${{ inputs.approval_phrase }}
        run: test "$CONFIRMATION" = 'Publish reviewed images'
      - name: Verify publishing branch restrictions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/aws/check-publish-environment.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Build, scan, publish immutable images
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_PREFIX: ${{ vars.ECR_PREFIX }}
        run: python3 scripts/aws/publish-images.py --confirm 'Publish reviewed images'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-image-digests
          path: .aws-artifacts/images.json
          retention-days: 7
