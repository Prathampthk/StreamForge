{
  "openapi": "3.1.0",
  "info": {
    "title": "StreamForge ingestion API",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "http://localhost:8080"
    }
  ],
  "paths": {
    "/v1/events": {
      "post": {
        "summary": "Durably publish validated event",
        "description": "Each encoded event <=8192 bytes. All validation precedes publication. Batch publication is non-atomic. Timeout/disconnect is an unknown outcome; retry original IDs. Logical HTTP duplicates are not deduplicated in Phase 2.",
        "security": [
          {
            "bearerKey": []
          }
        ],
        "parameters": [
          {
            "name": "X-Correlation-ID",
            "in": "header",
            "schema": {
              "type": "string",
              "maxLength": 64,
              "pattern": "^[A-Za-z0-9_-]+$"
            },
            "description": "Optional; invalid/missing values are replaced with a generated UUID."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../../schemas/event-v1.schema.json"
              }
            }
          }
        },
        "responses": {
          "400": {
            "description": "Malformed JSON, invalid contract or invalid batch",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid bearer key",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Tenant not authorized",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Body/event too large",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "Unsupported content type or encoding",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Request rate limit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Draining, saturation, timeout or unconfirmed publication; some/all records may exist in Kafka",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "202": {
            "description": "Every submitted event received a successful Kafka broker promise. This does not mean processed by ClickHouse.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "accepted",
                    "correlation_id",
                    "acknowledgments"
                  ],
                  "properties": {
                    "accepted": {
                      "type": "integer",
                      "minimum": 1
                    },
                    "correlation_id": {
                      "type": "string"
                    },
                    "acknowledgments": {
                      "type": "array",
                      "description": "One entry per successfully published event. Timestamp is the ingest process clock at the successful Kafka callback; synchronized clocks are required for cross-process freshness measurement. Entries need not preserve request order.",
                      "items": {
                        "type": "object",
                        "required": [
                          "event_id",
                          "acknowledged_at"
                        ],
                        "properties": {
                          "event_id": {
                            "type": "string",
                            "format": "uuid"
                          },
                          "acknowledged_at": {
                            "type": "string",
                            "format": "date-time"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/events/batch": {
      "post": {
        "summary": "Durably publish validated batch",
        "description": "Defaults: batch max 100 events / 1 MiB body. Each encoded event <=8192 bytes. All validation precedes publication. Batch publication is non-atomic. Timeout/disconnect is an unknown outcome; retry original IDs. Logical HTTP duplicates are not deduplicated in Phase 2.",
        "security": [
          {
            "bearerKey": []
          }
        ],
        "parameters": [
          {
            "name": "X-Correlation-ID",
            "in": "header",
            "schema": {
              "type": "string",
              "maxLength": 64,
              "pattern": "^[A-Za-z0-9_-]+$"
            },
            "description": "Optional; invalid/missing values are replaced with a generated UUID."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "array",
                "minItems": 1,
                "maxItems": 100,
                "items": {
                  "$ref": "../../schemas/event-v1.schema.json"
                }
              }
            }
          }
        },
        "responses": {
          "400": {
            "description": "Malformed JSON, invalid contract or invalid batch",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid bearer key",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Tenant not authorized",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Body/event too large",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "Unsupported content type or encoding",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Request rate limit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Draining, saturation, timeout or unconfirmed publication; some/all records may exist in Kafka",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "202": {
            "description": "Every submitted event received a successful Kafka broker promise. This does not mean processed by ClickHouse.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "accepted",
                    "correlation_id",
                    "acknowledgments"
                  ],
                  "properties": {
                    "accepted": {
                      "type": "integer",
                      "minimum": 1
                    },
                    "correlation_id": {
                      "type": "string"
                    },
                    "acknowledgments": {
                      "type": "array",
                      "description": "One entry per successfully published event. Timestamp is the ingest process clock at the successful Kafka callback; synchronized clocks are required for cross-process freshness measurement. Entries need not preserve request order.",
                      "items": {
                        "type": "object",
                        "required": [
                          "event_id",
                          "acknowledged_at"
                        ],
                        "properties": {
                          "event_id": {
                            "type": "string",
                            "format": "uuid"
                          },
                          "acknowledged_at": {
                            "type": "string",
                            "format": "date-time"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/livez": {
      "get": {
        "summary": "Process liveness",
        "responses": {
          "200": {
            "description": "Healthy or Prometheus exposition"
          },
          "503": {
            "description": "Readiness dependency unavailable/draining, or scrape saturation"
          }
        }
      }
    },
    "/readyz": {
      "get": {
        "summary": "Not draining; Kafka metadata lists 12 healthy partition leaders",
        "responses": {
          "200": {
            "description": "Healthy or Prometheus exposition"
          },
          "503": {
            "description": "Readiness dependency unavailable/draining, or scrape saturation"
          }
        }
      }
    },
    "/metrics": {
      "get": {
        "summary": "Prometheus metrics; finite labels only",
        "responses": {
          "200": {
            "description": "Healthy or Prometheus exposition"
          },
          "503": {
            "description": "Readiness dependency unavailable/draining, or scrape saturation"
          }
        }
      }
    },
    "/v1/metrics/revenue": {
      "get": {
        "summary": "Query canonical revenue minute buckets",
        "servers": [
          {
            "url": "http://localhost:8082"
          }
        ],
        "security": [
          {
            "bearerKey": []
          }
        ],
        "description": "Minute-aligned [from,to), max 24h by default, RFC3339 offsets normalize to UTC, empty buckets zero-filled. Unknown/repeated parameters rejected. Requires the query API key mapped to tenant. snapshot_last_success is a conservative observed refresh timestamp, not a Kafka watermark or event-freshness guarantee. Missing/failed/disabled/stale snapshots return 503.",
        "parameters": [
          {
            "name": "tenant_id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "from",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "interval",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "1m"
              ]
            }
          },
          {
            "name": "currency",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Z]{3}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Dense canonical minute buckets",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "tenant_id",
                    "from",
                    "to",
                    "interval",
                    "snapshot_last_success",
                    "snapshot_age_seconds",
                    "correlation_id",
                    "data"
                  ],
                  "properties": {
                    "tenant_id": {
                      "type": "string"
                    },
                    "currency": {
                      "type": "string"
                    },
                    "from": {
                      "type": "string",
                      "format": "date-time"
                    },
                    "to": {
                      "type": "string",
                      "format": "date-time"
                    },
                    "interval": {
                      "const": "1m"
                    },
                    "snapshot_last_success": {
                      "type": "string",
                      "format": "date-time"
                    },
                    "snapshot_age_seconds": {
                      "type": "number",
                      "minimum": 0
                    },
                    "correlation_id": {
                      "type": "string"
                    },
                    "data": {
                      "type": "array",
                      "maxItems": 1440,
                      "items": {
                        "type": "object",
                        "required": [
                          "minute",
                          "purchase_count",
                          "revenue_cents"
                        ],
                        "properties": {
                          "minute": {
                            "type": "string",
                            "format": "date-time"
                          },
                          "purchase_count": {
                            "type": "integer",
                            "minimum": 0
                          },
                          "revenue_cents": {
                            "type": "string",
                            "pattern": "^[0-9]+$",
                            "description": "Exact integer cents; decimal string preserves Int128 without float rounding."
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid parameters or window",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Query bearer key missing/invalid",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Tenant forbidden",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Saturated, draining, snapshot unhealthy or database failure; Retry-After=1",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/v1/metrics/traffic": {
      "get": {
        "summary": "Query canonical traffic minute buckets",
        "servers": [
          {
            "url": "http://localhost:8082"
          }
        ],
        "security": [
          {
            "bearerKey": []
          }
        ],
        "description": "Minute-aligned [from,to), max 24h by default, RFC3339 offsets normalize to UTC, empty buckets zero-filled. Unknown/repeated parameters rejected. Requires the query API key mapped to tenant. snapshot_last_success is a conservative observed refresh timestamp, not a Kafka watermark or event-freshness guarantee. Missing/failed/disabled/stale snapshots return 503.",
        "parameters": [
          {
            "name": "tenant_id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "from",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "interval",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "1m"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Dense canonical minute buckets",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "tenant_id",
                    "from",
                    "to",
                    "interval",
                    "snapshot_last_success",
                    "snapshot_age_seconds",
                    "correlation_id",
                    "data"
                  ],
                  "properties": {
                    "tenant_id": {
                      "type": "string"
                    },
                    "currency": {
                      "type": "string"
                    },
                    "from": {
                      "type": "string",
                      "format": "date-time"
                    },
                    "to": {
                      "type": "string",
                      "format": "date-time"
                    },
                    "interval": {
                      "const": "1m"
                    },
                    "snapshot_last_success": {
                      "type": "string",
                      "format": "date-time"
                    },
                    "snapshot_age_seconds": {
                      "type": "number",
                      "minimum": 0
                    },
                    "correlation_id": {
                      "type": "string"
                    },
                    "data": {
                      "type": "array",
                      "maxItems": 1440,
                      "items": {
                        "type": "object",
                        "required": [
                          "minute",
                          "events_per_minute",
                          "rpm",
                          "api_errors",
                          "error_rate"
                        ],
                        "properties": {
                          "minute": {
                            "type": "string",
                            "format": "date-time"
                          },
                          "events_per_minute": {
                            "type": "integer",
                            "minimum": 0
                          },
                          "rpm": {
                            "type": "integer",
                            "minimum": 0
                          },
                          "api_errors": {
                            "type": "integer",
                            "minimum": 0
                          },
                          "error_rate": {
                            "type": "number",
                            "minimum": 0,
                            "maximum": 1
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid parameters or window",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Query bearer key missing/invalid",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Tenant forbidden",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Saturated, draining, snapshot unhealthy or database failure; Retry-After=1",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerKey": {
        "type": "http",
        "scheme": "bearer",
        "description": "Local API key maps to the configured INGEST_TENANT. Use loopback locally; TLS is required before external exposure."
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message",
          "correlation_id"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "correlation_id": {
            "type": "string"
          },
          "retry_after_seconds": {
            "type": "integer",
            "minimum": 1
          }
        }
      }
    }
  }
}
