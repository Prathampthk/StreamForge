global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: ingest
    static_configs:
      - targets: [ingest-api:8080]
  - job_name: query
    static_configs:
      - targets: [query-api:8082]
  - job_name: consumer
    dns_sd_configs:
      - names: [consumer]
        type: A
        port: 8081
        refresh_interval: 5s
